<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Practice Quiz · CDA & MDA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f5f3f0; padding: 1rem; color: #1e1e1e; line-height: 1.5;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    }
    #app { max-width: 900px; width: 100%; margin: 0 auto; }
    .card {
      background: white; border-radius: 24px; padding: 1.75rem 1.5rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.05); margin-bottom: 1.5rem; border: 1px solid #e8e5e0;
    }
    h1, h2, h3 { font-weight: 600; line-height: 1.3; color: #1e1e1e; }
    h1 { font-size: 1.8rem; margin-bottom: 0.25rem; }
    h2 { font-size: 1.4rem; margin: 1.5rem 0 0.75rem; border-bottom: 2px solid #d9d5cf; padding-bottom: 0.3rem; }
    h3 { font-size: 1.1rem; margin: 1.25rem 0 0.5rem; }
    .question-block {
      margin-bottom: 2rem; padding-bottom: 1.25rem; border-bottom: 1px dashed #ddd;
    }
    .question-block:last-child { border-bottom: none; }
    .question-text { font-weight: 500; margin-bottom: 0.75rem; }
    .options { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.5rem; }
    .option-item {
      display: flex; align-items: flex-start; gap: 0.6rem; background: #faf9f7;
      padding: 0.7rem 1rem; border-radius: 40px; border: 1px solid #e0dcd6;
      cursor: pointer; transition: background 0.15s; font-size: 0.98rem;
    }
    .option-item:hover { background: #f0ede8; }
    .option-item input[type="radio"] {
      margin-top: 0.2rem; accent-color: #1e1e1e; width: 1.1rem; height: 1.1rem; flex-shrink: 0;
    }
    .option-item.selected { background: #e6e1da; border-color: #1e1e1e; }
    .submit-area { display: flex; justify-content: center; margin: 2rem 0 1rem; }
    .btn {
      background: #1e1e1e; color: white; border: none; padding: 0.9rem 2.2rem;
      border-radius: 60px; font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: background 0.15s, opacity 0.2s; font-family: inherit;
      border: 1px solid #1e1e1e; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .btn:hover { background: #333; }
    .btn-secondary { background: white; color: #1e1e1e; }
    .btn-secondary:hover { background: #f0ede8; }
    .hidden { display: none !important; }
    .preview-header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem;
    }
    .preview-stats { background: #edeae5; padding: 0.5rem 1.2rem; border-radius: 40px; font-size: 0.9rem; font-weight: 600; }
    .answer-row { padding: 0.75rem 0; border-bottom: 1px solid #eee; }
    .answer-row.correct .marker { color: #1a7a3a; font-weight: 600; }
    .answer-row.wrong .marker { color: #b03030; font-weight: 600; }
    .marker { display: inline-block; min-width: 2.5rem; }
    .student-answer { color: #555; font-style: italic; margin-left: 0.5rem; }
    .correct-answer { color: #1a7a3a; font-weight: 500; margin-left: 0.5rem; }
    .answer-key-block {
      background: #f8f7f5; padding: 0.75rem 1rem; border-radius: 12px; margin-top: 0.5rem;
      font-size: 0.9rem; color: #3d3d3d; border-left: 3px solid #1e1e1e;
    }
    @media (max-width: 600px) {
      .card { padding: 1.25rem 1rem; }
      h1 { font-size: 1.5rem; }
      .option-item { font-size: 0.92rem; padding: 0.65rem 0.9rem; }
    }
    @media print {
      body { background: white; padding: 0.5in; }
      .card { box-shadow: none; border: none; padding: 0; }
      .btn, .submit-area, .preview-stats, .no-print { display: none !important; }
      .answer-key-block { display: block !important; }
    }
    .no-print { display: block; }
  </style>
</head>
<body>
<div id="app">

  <!-- ====== QUIZ CONTAINER ====== -->
  <div id="quizContainer" class="card">
    <h1>📝 Practice Quiz: CDA & MDA</h1>
    <p style="color:#555; margin-bottom:1.5rem;">75 Questions · Shuffled · No Timer</p>
    <form id="quizForm" onsubmit="return false;">
      <div id="quizContent"></div>
    </form>
    <div class="submit-area">
      <button id="submitQuizBtn" class="btn" style="font-size:1.1rem; padding:1rem 3rem;">Submit Quiz</button>
    </div>
  </div>

  <!-- ====== PREVIEW PAGE ====== -->
  <div id="previewPage" class="hidden">
    <div class="card">
      <div class="preview-header">
        <h1>📄 Results Preview</h1>
        <div class="preview-stats" id="previewStats"></div>
      </div>
      <p style="margin-bottom:1rem; color:#555;">Review your answers below. You cannot return to edit.</p>
      <div id="previewContent"></div>
      <div style="display:flex; gap:1rem; flex-wrap:wrap; margin-top:2rem;" class="no-print">
        <button id="savePdfBtn" class="btn">⬇ Save as PDF</button>
        <button id="printBtn" class="btn btn-secondary">🖨 Print</button>
      </div>
    </div>
  </div>

</div>

<script>
(function() {
  "use strict";

  // ============================================================
  // QUESTION DATA
  // ============================================================
  const questions = [
    // --- Section A: Reading Comprehension ---
    { q: "According to the Week 3 notes, what is the primary objective of Multimodal Discourse Analysis (MDA)?", opts: ["To focus exclusively on the spoken word in political speeches.", "To provide a complete and coherent analysis of a text, including power relations.", "To translate visual images into written language for the blind.", "To replace traditional linguistic analysis entirely."], ans: 1 },
    { q: "In the context of CDA, how does Foucault define \"discourse\"?", opts: ["It is purely a linguistic structure independent of society.", "It socially produces \"knowledge\" and is closely tied to the social context.", "It is the physical text printed on a page.", "It is a psychological tool used only by individuals."], ans: 1 },
    { q: "According to Fairclough's model, what does it mean that CDA is \"dialectical\"?", opts: ["It only looks at historical documents to find meaning.", "It focuses on the argument between the researcher and the text.", "It examines relations between different objects that influence each other but cannot be separated.", "It uses a strict two-step method of analysis."], ans: 2 },
    { q: "Which of the following is a characteristic of Van Dijk's \"social macro level\" analysis?", opts: ["Investigating individual verbal interactions.", "Analyzing the power, dominance, and inequality between social groups.", "Examining the grammatical structure of a single sentence.", "Studying the personal thoughts of a journalist."], ans: 1 },
    { q: "Based on the Week 9 reading, why is it incorrect to say \"the image is biased\" without further evidence?", opts: ["Images are never biased; only words are.", "Analysts must first describe the evidence, explain a plausible effect, and consider alternative readings.", "Bias is impossible to prove in a court of law.", "The audience always interprets images correctly."], ans: 1 },
    { q: "In the TEMPO magazine cover analysis (Week 3), what did the researchers conclude about the visual elements (pictorial mode)?", opts: ["They presented President Jokowi in a highly positive and patriotic light.", "They aimed to show President Jokowi in a negative light and portray his actions as a lie.", "They were entirely neutral and focused only on his clothing.", "They were completely unrelated to the text on the cover."], ans: 1 },
    { q: "According to the Week 3 text, how is \"ideology\" defined in relation to a text?", opts: ["It is the specific arrangement of discourses found within a particular text.", "It is the physical print of the text.", "It is the translator's personal opinion.", "It is the grammar used by the author."], ans: 0 },
    { q: "What does the Week 5 notes identify as a key aspect of the \"critical\" in CDA?", opts: ["It focuses only on positive aspects of society.", "It looks at what is not working in a society and considers how to fix it based on values.", "It criticizes individuals for their personal life choices.", "It ignores social issues to focus on aesthetics."], ans: 1 },
    { q: "How does the Week 9 reading describe the relationship between different modes in a media text?", opts: ["They are always perfectly aligned and reinforce each other.", "Meaning emerges from how the elements work together, and they can reinforce, extend, or contradict one another.", "The written text always overpowers the visual elements.", "They are completely separate and should be analyzed in isolation."], ans: 1 },
    { q: "According to Van Dijk (2015), how does he define \"social power\"?", opts: ["The ability to physically force someone to do something.", "A tool to control the acts and minds of less powerful groups.", "The economic wealth of a media company.", "The grammatical complexity of a politician's speech."], ans: 1 },
    { q: "In the analysis of the *Piggybook* cover (Week 3), what gender issue is represented?", opts: ["The lack of male authors in children's literature.", "The unfair division of household chores based on gender.", "The celebration of female independence in the workplace.", "The dominance of men in the publishing industry."], ans: 1 },
    { q: "Which of the following best describes the \"relational\" aspect of Fairclough's CDA?", opts: ["It focuses on the relationship between a word and its definition.", "It focuses on social relations rather than individual ones.", "It analyzes the relationship between the researcher and the university.", "It looks at the relationship between two different languages."], ans: 1 },
    { q: "According to the Week 9 reading, how do media makers usually imagine their audience?", opts: ["As a completely blank slate with no prior knowledge.", "By assuming what they know, value, fear, or desire, often using pronouns like \"we\" or \"them.\"", "As highly trained linguists who analyze every word.", "As people who only read the captions and ignore the images."], ans: 1 },
    { q: "What is the main focus of CDA research regarding gender inequality, as noted in Week 5?", opts: ["How men are always portrayed as victims in media.", "How media often blames women for sexual crimes based on their clothing or location.", "How gender inequality has been completely solved in modern media.", "How women are always portrayed as the powerful actors in society."], ans: 1 },
    { q: "What does the Week 3 notes say about the relationship between multimodality and meaning?", opts: ["Only spoken language carries real meaning.", "All modes of communication available in a culture form a single, interconnected field of resources.", "Multimodality is only applicable to visual arts, not literature.", "It states that written text is the most important mode."], ans: 1 },
    { q: "According to the Week 9 reading, what is the purpose of using a \"low camera angle\" in media?", opts: ["To make the subject appear weak and powerless.", "To make the subject appear powerful.", "To show the environment rather than the person.", "To create a sense of confusion."], ans: 1 },
    { q: "Which of the following is one of Van Dijk's main principles of CDA?", opts: ["Language is a neutral tool that does not shape society.", "Language shapes and forms society and culture.", "Discourse analysis should ignore historical contexts.", "Power dynamics are never expressed through language."], ans: 1 },
    { q: "According to Week 5, what happens to the \"responsibility\" of an actor when a sentence uses nominalization (e.g., \"The protest was disrupted\")?", opts: ["The responsibility becomes clearer.", "The responsible actor is hidden or omitted.", "The police are automatically blamed.", "The sentence becomes grammatically incorrect."], ans: 1 },
    { q: "How does the Week 9 reading distinguish between \"reinforcement\" and \"contradiction\" in multimodality?", opts: ["Reinforcement means words and images send different messages; contradiction means they are identical.", "Reinforcement means words and images communicate a similar message; contradiction creates tension or irony.", "Reinforcement is only used in videos; contradiction is only used in print.", "Reinforcement is when an image has a caption; contradiction is when it does not."], ans: 1 },
    { q: "Why does the Week 5 text state that CDA cannot stand as a single independent method?", opts: ["Because it is too easy and doesn't require research.", "Because it is transdisciplinary and requires other relevant theories and methods to be comprehensive.", "Because it only works with quantitative data.", "Because it is an outdated theory that no one uses anymore."], ans: 1 },
    { q: "In the context of \"quoting verbs\" (Week 9), what does the verb \"claimed\" often do?", opts: ["It makes the statement sound like an undeniable fact.", "It can invite doubt or suggest the statement is contested.", "It shows that the speaker is completely neutral.", "It proves that the speaker is lying."], ans: 1 },
    { q: "According to Week 3, what is required for a text to become coherent?", opts: ["It must be written in a single language.", "It must use semiotic tools to establish connections within the text and with the world around it.", "It must be at least 500 words long.", "It must contain at least one image."], ans: 1 },
    { q: "What does the Week 9 reading suggest about the use of \"honorifics\" (like President, Minister) in media?", opts: ["They have no effect on the audience's perception.", "They can signal status, authority, and respect, making a claim appear more authoritative.", "They are only used in fictional stories.", "They are used to make the speaker sound less credible."], ans: 1 },
    { q: "What is the \"micro level\" of society in Van Dijk's framework?", opts: ["Power, dominance, and inequality between groups.", "Language use, discourse, verbal interaction, and communication.", "The economic structure of a country.", "The historical context of a war."], ans: 1 },
    { q: "According to Week 5, how can critical analysis transform society?", opts: ["By ignoring social problems and focusing on art.", "By producing discourses that can challenge negative interpretations and justify new ways of thinking.", "By forcing people to agree with the researcher.", "By eliminating the use of language in media."], ans: 1 },

    // --- Section B: Theories & Concepts ---
    { q: "In the context of social actor representation, what is \"Objectivation\"?", opts: ["Representing a person by their full name and title.", "Representing a person through a feature, body part, or associated object rather than as a whole person.", "Representing a group of people using statistics.", "Hiding the identity of a person completely."], ans: 1 },
    { q: "Which transitivity process involves \"sensing, thinking, and feeling\"?", opts: ["Material process", "Mental process", "Verbal process", "Relational process"], ans: 1 },
    { q: "According to Kress and van Leeuwen, what does the \"Compositional metafunction\" deal with?", opts: ["The actions of the participants in the image.", "The relationship between the viewer and the image.", "The arrangement, information value, salience, and framing of elements.", "The literal meaning of the text."], ans: 2 },
    { q: "What is \"Anonymization\" in the classification of social actors?", opts: ["Naming a person by their role (e.g., \"the manager\").", "Leaving the actor unidentified (e.g., \"a source said\").", "Using a person's full name.", "Representing a person as a type rather than an individual."], ans: 1 },
    { q: "Which of the following is an example of a \"Metapropositional verb\"?", opts: ["Said", "Whispered", "Announced", "Added"], ans: 2 },
    { q: "What does the term \"Transitivity\" refer to in CDA?", opts: ["The ability to translate a text from one language to another.", "How clauses represent actions, experiences, and relationships (who does what to whom).", "The speed at which a message is delivered.", "The length of a sentence."], ans: 1 },
    { q: "According to Halliday's Systemic Functional Language (SFL), what are the three main communicative functions?", opts: ["Ideational, Interpersonal, and Textual.", "Representational, Interactional, and Compositional.", "Denotation, Connotation, and Myth.", "Icon, Index, and Symbol."], ans: 0 },
    { q: "What is \"Synecdoche\"?", opts: ["Using a part to represent a whole, or the whole to represent a part (e.g., \"wheels\" for a car).", "Giving human qualities to non-human things.", "Deliberate exaggeration for emotional force.", "Using something closely associated with a thing to refer to it (e.g., \"The White House\")."], ans: 0 },
    { q: "Which of the following describes a \"Material process\" in transitivity analysis?", opts: ["The process of thinking or feeling.", "The process of doing and happening, often involving an Actor and a Goal.", "The process of saying or communicating.", "The process of establishing identity or attributes."], ans: 1 },
    { q: "In the context of visual analysis, what is \"Salience\"?", opts: ["The most eye-catching element in the composition, determined by size, color, or focus.", "The lines or borders that separate elements.", "The placement of elements on the left or right.", "The physical distance between the camera and the subject."], ans: 0 },
    { q: "What is a \"Nominalization\" in CDA?", opts: ["Turning a verb or adjective into a noun, which can hide the actor and responsibility.", "Using a person's name instead of their title.", "Quoting someone directly.", "Using a metaphor to describe an event."], ans: 0 },
    { q: "According to the text, what is \"Hyperbole\"?", opts: ["A subtle hint or suggestion.", "A deliberate exaggeration for emphasis or emotional force.", "A comparison between two unlike things.", "The repetition of a word for emphasis."], ans: 1 },
    { q: "What does the \"Interactional metafunction\" focus on?", opts: ["The actions taking place inside the image.", "The relationship between the represented participants and the interactive participants (viewers).", "The layout and composition of the image.", "The historical context of the image."], ans: 1 },
    { q: "Which of the following is a \"Metalinguistic verb\"?", opts: ["Shout", "Narrate", "Claim", "Ask"], ans: 1 },
    { q: "What is \"Collectivization\" in social actor representation?", opts: ["Focusing on one specific person.", "Representing people as a group (e.g., \"the police\").", "Hiding the identity of a person.", "Using numbers to represent people."], ans: 1 },
    { q: "In CDA, what is the difference between \"Denotation\" and \"Connotation\"?", opts: ["Denotation is the cultural meaning; Connotation is the literal meaning.", "Denotation is the literal meaning; Connotation is the cultural or emotional association.", "Denotation is used only in images; Connotation is used only in text.", "They mean the exact same thing."], ans: 1 },
    { q: "What is \"Metonymy\"?", opts: ["Using something closely associated with a thing to refer to it (e.g., \"The Crown\" for the monarchy).", "Giving human qualities to non-human things.", "A deliberate exaggeration.", "The repetition of a word at the beginning of clauses."], ans: 0 },
    { q: "Which of the following is an example of \"Suppression\" in social actor representation?", opts: ["\"The police arrested the man.\"", "\"The man was arrested by the police.\"", "\"The arrest was made.\"", "\"Officer Smith arrested the man.\""], ans: 2 },
    { q: "According to Fairclough, what does the \"transdisciplinary\" nature of CDA mean?", opts: ["It only looks at texts from different time periods.", "It requires utilizing other related theories, methodologies, and frameworks in the analysis.", "It can only be used by people with a degree in linguistics.", "It analyzes multiple languages at the same time."], ans: 1 },
    { q: "In the context of quoting verbs, what do \"Transcript verbs\" do?", opts: ["Describe how the speech was delivered (e.g., whispered).", "Organize a speaker's contribution or show that they are developing a point (e.g., added, continued).", "Present speech with relatively little explicit evaluation (e.g., said).", "Characterize the perceived reliability of a statement (e.g., claimed)."], ans: 1 },
    { q: "What is the difference between an \"Icon\" and an \"Index\"?", opts: ["An icon resembles its object; an index has a causal or physical connection to its object.", "An icon is based on convention; an index is based on resemblance.", "An icon is a written word; an index is a spoken word.", "They are exactly the same thing."], ans: 0 },
    { q: "What does \"Individualization\" mean in social actor representation?", opts: ["Representing people as a group.", "Focusing on a single person as an individual.", "Hiding the identity of a person.", "Using statistics to represent a population."], ans: 1 },
    { q: "Which transitivity process is used to establish identity, attributes, or relationships?", opts: ["Material", "Mental", "Behavioral", "Relational"], ans: 3 },
    { q: "What is a \"Dutch angle\" in visual analysis?", opts: ["A shot taken from directly above the subject.", "A shot taken from a low angle to show power.", "A shot where the camera is tilted to create a sense of unease or tension.", "A shot taken at eye level to show equality."], ans: 2 },
    { q: "What does the term \"Hedging\" refer to in CDA?", opts: ["Using words that show uncertainty or soften a claim (e.g., \"possibly,\" \"might\").", "Exaggerating a claim to make it stronger.", "Directly quoting a source.", "Using a metaphor to explain a complex idea."], ans: 0 },

    // --- Section C: Application & Implementation ---
    { q: "A news headline reads: \"Mob Rampage Destroys Local Shops.\" The photograph shows a group of people, including families, walking peacefully. What is the most likely analytical observation?", opts: ["The text and image perfectly reinforce each other.", "There is a contradiction between the text's use of hyperbole and the peaceful visual evidence.", "The image is completely irrelevant to the text.", "The text uses a neutral structuring verb."], ans: 1 },
    { q: "If an article states: \"The Minister of Finance claimed the economy is improving, while a citizen said it is not,\" how are the quoting verbs distributing credibility?", opts: ["\"Claimed\" makes the Minister sound more reliable than the citizen.", "\"Said\" makes the citizen sound more emotional than the Minister.", "\"Claimed\" invites doubt about the Minister's statement, while \"said\" presents the citizen's statement neutrally.", "Both verbs present the statements as undeniable facts."], ans: 2 },
    { q: "You see an advertisement for a luxury watch. The camera angle is looking up at the model from below. What is the likely effect of this perspective?", opts: ["It makes the model appear weak and submissive.", "It makes the model appear powerful and authoritative.", "It creates a sense of unease and tension.", "It makes the watch look small."], ans: 1 },
    { q: "A political campaign video uses ominous, low-tempo music while showing images of a rival candidate. Which mode is primarily being used to frame the rival candidate as threatening?", opts: ["The verbal mode (the text on screen).", "The audio mode (the music).", "The spatial mode (the layout).", "The gestural mode (the candidate's movement)."], ans: 1 },
    { q: "In a news report, the police are described as \"explaining\" a situation, while protesters are described as \"grumbling.\" What is the likely effect of these verb choices?", opts: ["It makes the protesters seem more credible than the police.", "It makes the police seem more authoritative and the protesters seem like they are just complaining.", "It makes both groups seem equally credible.", "It shows that the police are uncertain about the situation."], ans: 1 },
    { q: "A headline reads: \"Three students injured during campus protest.\" Who is the actor in this clause, according to transitivity analysis?", opts: ["Three students", "The protest", "The person who injured them (who is omitted)", "The campus"], ans: 2 },
    { q: "If a text refers to a specific person as \"a young man\" rather than naming him, which social actor classification is being used?", opts: ["Nomination", "Generization", "Aggregation", "Anonymization"], ans: 1 },
    { q: "An article about a protest uses the metaphor of a \"battlefield\" and the \"war on the streets.\" Which features of the event are being highlighted?", opts: ["Cooperation and peaceful negotiation.", "Conflict, sides, and aggression.", "The economic cost of the protest.", "The historical context of the location."], ans: 1 },
    { q: "A commercial shows a family enjoying a meal together while a voiceover says, \"Bring your family closer.\" Which modes are interacting here to create meaning?", opts: ["Verbal (voiceover) and visual (the family).", "Spatial and gestural only.", "Audio and linguistic only.", "None of the modes interact."], ans: 0 },
    { q: "In a photograph, a politician is shown with a tight grip on the microphone and a tense facial expression, but the caption says they \"insisted everything was under control.\" What does this mismatch suggest to an analyst?", opts: ["That the politician is definitely lying.", "That the image and text create tension, possibly suggesting discomfort despite the verbal claim.", "That the photographer made a mistake.", "That the text is the only thing that matters."], ans: 1 },
    { q: "A sentence reads: \"The decision to cut funding was made.\" Which CDA tool is being used to hide who made the decision?", opts: ["Nominalization (turning \"decide\" into \"decision\") and passive voice.", "Personalization.", "Hyperbole.", "Metonymy."], ans: 0 },
    { q: "If a media outlet uses \"The White House announced...\" instead of \"The President announced...\", which trope is being used, and what is the potential effect?", opts: ["Synecdoche; it emphasizes the building itself.", "Metonymy; it hides the specific decision-maker behind an institution.", "Personification; it gives the building human qualities.", "Metaphor; it compares the White House to a person."], ans: 1 },
    { q: "A video shows a person looking directly at the camera and asking, \"Do you want to change your life?\" Which interactive feature is being used?", opts: ["Offer contact", "Demand contact", "Low angle", "Long shot"], ans: 1 },
    { q: "An article about a foreign country uses statistics heavily (e.g., \"70% of the population...\") but does not interview any of the citizens. Which social actor representation is prominent, and who is suppressed?", opts: ["Aggregation is used; the individual voices of the citizens are suppressed.", "Individualization is used; the government is suppressed.", "Anonymization is used; the journalists are suppressed.", "Personalization is used; the foreign country is suppressed."], ans: 0 },
    { q: "A poster for a charity shows a close-up of a child's face with large, sad eyes. What is the likely purpose of this composition?", opts: ["To create a sense of distance and objectivity.", "To create intimacy and evoke empathy from the viewer.", "To show the child's physical strength.", "To emphasize the background environment."], ans: 1 },
    { q: "Read the clause: \"Residents fear eviction.\" Which transitivity process is \"fear\"?", opts: ["Material", "Verbal", "Mental", "Relational"], ans: 2 },
    { q: "A news story about a car accident uses the headline: \"Car Crash Leaves Two Dead.\" Who is the Actor in this sentence?", opts: ["The driver", "The car crash", "The two dead people", "There is no Actor; it is an existential process."], ans: 3 },
    { q: "When analyzing a meme, you notice that the text says \"I'm totally fine\" but the image is a character crying. What is the interaction between modes?", opts: ["Reinforcement", "Contradiction", "Complementarity", "Suppression"], ans: 1 },
    { q: "A political speech uses the phrase \"We must protect our children from them.\" What is the function of the pronouns here?", opts: ["To create an in-group (\"we,\" \"our\") and an out-group (\"them\").", "To make the speech more formal.", "To hide the identity of the speaker.", "To provide specific evidence."], ans: 0 },
    { q: "An image shows a group of people from a distance, seen from a high angle. According to visual grammar, what does this suggest?", opts: ["The people are powerful and important.", "The viewer is positioned as equal to the people.", "The people are seen as small or less powerful compared to the viewer.", "The image is focused on the people's facial expressions."], ans: 2 },
    { q: "A journalist writes: \"The protesters 'whispered' their demands.\" What is the likely effect of using \"whispered\" instead of \"said\"?", opts: ["It makes the protesters seem confident and loud.", "It might imply fear, secrecy, or a lack of power.", "It makes their demands seem more legitimate.", "It makes the journalist seem biased toward the protesters."], ans: 1 },
    { q: "If an analyst is looking at an image and asks, \"Who is in the center? Who is cropped out?\" which visual concept are they exploring?", opts: ["Information value (placement).", "Modality.", "Transitivity.", "Quoting verbs."], ans: 0 },
    { q: "A headline reads: \"Government Bureaucrats Waste Taxpayer Money.\" Which social actor classification is used for the government workers?", opts: ["Individualization (they are named).", "Collectivization (they are grouped as \"bureaucrats\").", "Suppression (they are omitted).", "Objectivation (they are represented by money)."], ans: 1 },
    { q: "A video shows a politician speaking. The camera is at eye level, and the politician looks directly at the lens. What is the likely intended relationship with the audience?", opts: ["The audience is positioned as inferior.", "The audience is positioned as an equal, engaging in a direct address.", "The audience is positioned as a detached observer.", "The politician is presented as a distant figure."], ans: 1 },
    { q: "A text uses the phrase \"The storm of controversy\" to describe a political scandal. Which rhetorical trope is this?", opts: ["Metonymy", "Metaphor", "Synecdoche", "Hyperbole"], ans: 1 }
  ];

  // ============================================================
  // UTILITIES & STATE
  // ============================================================
  function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  let shuffledQuestions = [];
  let userAnswers = {};
  let currentCorrectMap = {};

  const quizContainer = document.getElementById('quizContainer');
  const previewPage = document.getElementById('previewPage');
  const quizContent = document.getElementById('quizContent');
  const previewContent = document.getElementById('previewContent');
  const previewStats = document.getElementById('previewStats');
  const submitQuizBtn = document.getElementById('submitQuizBtn');
  const savePdfBtn = document.getElementById('savePdfBtn');
  const printBtn = document.getElementById('printBtn');

  // ============================================================
  // RENDER QUIZ
  // ============================================================
  function renderQuiz() {
    // Shuffle questions
    shuffledQuestions = shuffleArray(questions);
    userAnswers = {};
    currentCorrectMap = {};

    let html = '';

    shuffledQuestions.forEach((q, idx) => {
      const qNum = idx + 1;
      const letters = ['A', 'B', 'C', 'D'];
      
      // Shuffle options for this question
      const indexedOpts = q.opts.map((opt, i) => ({ opt, origIdx: i }));
      const shuffledOpts = shuffleArray(indexedOpts);
      
      // Find the new index of the correct answer
      const newCorrectIdx = shuffledOpts.findIndex(o => o.origIdx === q.ans);
      currentCorrectMap[idx] = letters[newCorrectIdx];

      html += `<div class="question-block" data-qidx="${idx}">`;
      html += `<div class="question-text">${qNum}. ${q.q}</div>`;
      html += `<div class="options">`;
      shuffledOpts.forEach((o, oi) => {
        const letter = letters[oi];
        html += `<label class="option-item" data-letter="${letter}">
          <input type="radio" name="q_${idx}" value="${letter}" data-qidx="${idx}">
          <span>${letter}. ${o.opt}</span>
        </label>`;
      });
      html += `</div></div>`;
    });

    quizContent.innerHTML = html;

    // Attach listeners
    quizContent.querySelectorAll('input[type="radio"]').forEach(inp => {
      inp.addEventListener('change', function() {
        const name = this.name;
        document.querySelectorAll(`input[name="${name}"]`).forEach(r => r.closest('.option-item').classList.remove('selected'));
        this.closest('.option-item').classList.add('selected');
        userAnswers[this.dataset.qidx] = this.value;
      });
    });
  }

  // ============================================================
  // SUBMIT & PREVIEW
  // ============================================================
  function submitQuiz() {
    let html = '';
    let correctCount = 0;

    shuffledQuestions.forEach((q, idx) => {
      const userLetter = userAnswers[idx] || null;
      const correctLetter = currentCorrectMap[idx];
      const isCorrect = userLetter === correctLetter;
      if (isCorrect) correctCount++;

      // Find the text of the correct answer for the answer key display
      // We need to look at the shuffled options again to display the correct text.
      // Since we didn't save the shuffled options, let's display the correct letter and the original text.
      // Wait, the original text of the correct answer is q.opts[q.ans].
      const correctAnswerText = q.opts[q.ans];

      html += `<div class="answer-row ${isCorrect ? 'correct' : 'wrong'}">
        <span class="marker">${isCorrect ? '✓' : '✗'}</span>
        <strong>Q${idx + 1}.</strong> ${q.q}<br>
        <span class="student-answer">Your answer: ${userLetter || '(not answered)'}</span>`;
      
      if (!isCorrect) {
        html += `<br><span class="correct-answer">Correct answer: ${correctLetter} (${correctAnswerText})</span>`;
      } else {
        html += `<br><span class="correct-answer">Correct!</span>`;
      }
      
      html += `</div>`;
    });

    previewContent.innerHTML = html;
    previewStats.textContent = `Score: ${correctCount} / ${shuffledQuestions.length}`;

    quizContainer.classList.add('hidden');
    previewPage.classList.remove('hidden');
    window.scrollTo(0, 0);
  }

  // ============================================================
  // EVENTS
  // ============================================================
  submitQuizBtn.addEventListener('click', () => {
    if (confirm('Are you sure you want to submit? You cannot return to edit.')) {
      submitQuiz();
    }
  });

  savePdfBtn.addEventListener('click', () => window.print());
  printBtn.addEventListener('click', () => window.print());

  // ============================================================
  // INIT
  // ============================================================
  renderQuiz();

})();
</script>
</body>
</html>
